<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyro Drop — The Wobbly Hauler</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #c { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'Courier New', monospace;
  }
  .panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0, 8, 20, 0.78);
    border: 1px solid rgba(0,255,136,0.3);
    border-radius: 6px;
    padding: 10px 16px;
    color: #00ff88;
    font-size: 13px;
    line-height: 2.1;
    text-shadow: 0 0 7px rgba(0,255,136,0.7);
    backdrop-filter: blur(8px);
  }
  .panel span { color: #fff; font-weight: bold; }
  #tilt-canvas {
    position: absolute;
    bottom: 16px; right: 16px;
    border-radius: 50%;
    border: 1px solid rgba(0,255,136,0.25);
  }
  #controls-hint {
    position: absolute; bottom: 16px; left: 16px;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    line-height: 1.9;
  }
  #step-tag {
    position: absolute; top: 16px; right: 16px;
    color: rgba(255,255,255,0.2);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="panel">
    ALT:&nbsp;&nbsp; <span id="v-alt">0.00</span> m<br>
    TILT:&nbsp; <span id="v-tilt">0.0</span>°<br>
    SPEED: <span id="v-spd">0.00</span> m/s<br>
    CARGO: <span id="v-cargo">3 / 3</span>
  </div>
  <canvas id="tilt-canvas" width="90" height="90"></canvas>
  <div id="controls-hint">
    [SPACE] Thrust Up<br>
    [W / S] Pitch Fwd / Back<br>
    [A / D] Roll Left / Right<br>
    [Q / E] Yaw Left / Right<br>
    [R]&nbsp;&nbsp;&nbsp; Reset
  </div>
  <div id="step-tag">Step 1 · Physics Core</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

// ─── TUNABLE CONSTANTS (will become upgradeable stats) ────────────────────
const GRAVITY        = -14;
const DRONE_MASS     = 2.0;
const CARGO_MASS     = 0.38;
let   THRUST_POWER   = 38;   // N  — "Motor KV Rating" upgrade
let   AUTO_STABILIZE = 1.0;  // ×  — "Gyroscope Tuning" upgrade
const TORQUE_POWER   = 7.5;  // N·m
const YAW_POWER      = 3.5;
const LIN_DAMP       = 0.28;
const ANG_DAMP       = 0.45;

// Drone geometry (half-extents)
const DX = 1.0, DY = 0.11, DZ = 1.0;
// Lip dimensions — small ridge around deck to prevent instant cargo slide
const LIP_H = 0.12, LIP_T = 0.052;
// Cargo box half-extent
const CR = 0.27;

// ─── CANNON PHYSICS WORLD ─────────────────────────────────────────────────
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, GRAVITY, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 20;

// ─── CONTACT MATERIALS ────────────────────────────────────────────────────
const matDrone  = new CANNON.Material('drone');
const matCargo  = new CANNON.Material('cargo');
const matGround = new CANNON.Material('ground');

// Cargo grips the deck well but can still tip with sharp manoeuvres
world.addContactMaterial(new CANNON.ContactMaterial(matDrone, matCargo, {
  friction: 0.85, restitution: 0.06
}));
world.addContactMaterial(new CANNON.ContactMaterial(matGround, matCargo, {
  friction: 0.55, restitution: 0.2
}));
world.addContactMaterial(new CANNON.ContactMaterial(matGround, matDrone, {
  friction: 0.4,  restitution: 0.05
}));

// ─── GROUND ───────────────────────────────────────────────────────────────
const gndBody = new CANNON.Body({ mass: 0, material: matGround });
gndBody.addShape(new CANNON.Plane());
gndBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(gndBody);

// ─── DRONE BODY ───────────────────────────────────────────────────────────
const droneBody = new CANNON.Body({ mass: DRONE_MASS, material: matDrone });
droneBody.addShape(new CANNON.Box(new CANNON.Vec3(DX, DY, DZ)));

// Invisible lip colliders around deck edges — cargo must TIP, not slide
const lipY = DY + LIP_H; // y-offset of lip centre from drone centre
droneBody.addShape(
  new CANNON.Box(new CANNON.Vec3(DX, LIP_H, LIP_T)),
  new CANNON.Vec3(0, lipY, -(DZ - LIP_T))   // front
);
droneBody.addShape(
  new CANNON.Box(new CANNON.Vec3(DX, LIP_H, LIP_T)),
  new CANNON.Vec3(0, lipY,  (DZ - LIP_T))   // back
);
droneBody.addShape(
  new CANNON.Box(new CANNON.Vec3(LIP_T, LIP_H, DZ)),
  new CANNON.Vec3(-(DX - LIP_T), lipY, 0)   // left
);
droneBody.addShape(
  new CANNON.Box(new CANNON.Vec3(LIP_T, LIP_H, DZ)),
  new CANNON.Vec3( (DX - LIP_T), lipY, 0)   // right
);

droneBody.linearDamping  = LIN_DAMP;
droneBody.angularDamping = ANG_DAMP;
world.addBody(droneBody);

// ─── CARGO BODIES ─────────────────────────────────────────────────────────
const CARGO_COLORS = [0xff6b35, 0x00d4ff, 0xffe033];
const cargoBodies  = CARGO_COLORS.map(() => {
  const b = new CANNON.Body({ mass: CARGO_MASS, material: matCargo });
  b.addShape(new CANNON.Box(new CANNON.Vec3(CR, CR, CR)));
  b.linearDamping  = 0.2;
  b.angularDamping = 0.35;
  world.addBody(b);
  return b;
});

// ─── THREE.JS RENDERER & SCENE ────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080f);
scene.fog = new THREE.FogExp2(0x05080f, 0.016);

const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 600);

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
onResize();
addEventListener('resize', onResize);

// ─── LIGHTING ─────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2a44, 3));
const sun = new THREE.DirectionalLight(0xfff4e0, 3.5);
sun.position.set(15, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -35, right: 35, top: 35, bottom: -35, near: 1, far: 120 });
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x0022aa, 0x0a1a08, 1.4));

// Rotor point-lights (glow effect, positioned each frame)
const rotorLights = [0, 1, 2, 3].map(() => {
  const l = new THREE.PointLight(0x00ffaa, 0.5, 3.5);
  scene.add(l);
  return l;
});

// ─── GROUND MESH ──────────────────────────────────────────────────────────
const gndMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400, 80, 80),
  new THREE.MeshStandardMaterial({ color: 0x0d160d, roughness: 0.95, metalness: 0.05 })
);
gndMesh.rotation.x = -Math.PI / 2;
gndMesh.receiveShadow = true;
scene.add(gndMesh);
scene.add(new THREE.GridHelper(400, 80, 0x00ff4406, 0x00ff4403));

// ─── BACKGROUND STARS ─────────────────────────────────────────────────────
{
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(3000);
  for (let i = 0; i < pos.length; i += 3) {
    const r = 250 + Math.random() * 100;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.random() * Math.PI * 0.5 + 0.1;
    pos[i]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i+1] = r * Math.cos(phi) + 5;
    pos[i+2] = r * Math.sin(phi) * Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, sizeAttenuation: true })));
}

// ─── DRONE MESH ───────────────────────────────────────────────────────────
const droneGroup = new THREE.Group();
scene.add(droneGroup);

// Deck plate
{
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(DX * 2, DY * 2, DZ * 2),
    new THREE.MeshStandardMaterial({ color: 0x252830, roughness: 0.22, metalness: 0.88 })
  );
  m.castShadow = true; m.receiveShadow = true;
  droneGroup.add(m);
}

// Central hub
{
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(0.17, 0.21, 0.16, 8),
    new THREE.MeshStandardMaterial({ color: 0x181a22, roughness: 0.28, metalness: 0.92 })
  );
  m.castShadow = true;
  droneGroup.add(m);
}

// Arms + motor mounts + rotor discs
const ARM_DIRS = [
  new THREE.Vector3( DX * 0.72, 0, -DZ * 0.72),
  new THREE.Vector3(-DX * 0.72, 0, -DZ * 0.72),
  new THREE.Vector3( DX * 0.72, 0,  DZ * 0.72),
  new THREE.Vector3(-DX * 0.72, 0,  DZ * 0.72),
];
const rotorDiscs = [];
const armMat   = new THREE.MeshStandardMaterial({ color: 0x1c1e27, roughness: 0.32, metalness: 0.82 });
const motorMat = new THREE.MeshStandardMaterial({ color: 0x2e3040, roughness: 0.2,  metalness: 0.9  });
const rotorMat = new THREE.MeshStandardMaterial({
  color: 0x00ffaa, emissive: 0x00aa66, emissiveIntensity: 0.9,
  transparent: true, opacity: 0.55, side: THREE.DoubleSide
});

ARM_DIRS.forEach((dir, i) => {
  // Arm strut
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.07, 0.62), armMat);
  arm.position.copy(dir).multiplyScalar(0.5);
  arm.lookAt(dir.clone().multiplyScalar(3));
  arm.castShadow = true;
  droneGroup.add(arm);

  // Motor mount cylinder
  const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.13, 8), motorMat);
  motor.position.set(dir.x, 0.08, dir.z);
  droneGroup.add(motor);

  // Rotor disc
  const rotor = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.02, 16), rotorMat);
  rotor.position.set(dir.x, 0.13, dir.z);
  droneGroup.add(rotor);
  rotorDiscs.push(rotor);
});

// Landing legs (4 small struts)
const legMat = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.5, metalness: 0.7 });
[[-0.7, 0, -0.7], [0.7, 0, -0.7], [-0.7, 0, 0.7], [0.7, 0, 0.7]].forEach(([x, , z]) => {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.28, 5), legMat);
  leg.position.set(x, -DY - 0.14, z);
  droneGroup.add(leg);
});

// ─── CARGO MESHES ─────────────────────────────────────────────────────────
const cargoMeshes = CARGO_COLORS.map(color => {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(CR * 2, CR * 2, CR * 2),
    new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.15 })
  );
  m.castShadow = true;
  scene.add(m);
  return m;
});

// ─── INPUT ────────────────────────────────────────────────────────────────
const K = {};
const PREVENT = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
addEventListener('keydown', e => {
  K[e.code] = true;
  if (PREVENT.has(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { K[e.code] = false; });

// ─── RESET ────────────────────────────────────────────────────────────────
const START_Y = 2.5;

function resetDrone() {
  droneBody.position.set(0, START_Y, 0);
  droneBody.velocity.set(0, 0, 0);
  droneBody.angularVelocity.set(0, 0, 0);
  droneBody.quaternion.set(0, 0, 0, 1);
  droneBody.force.set(0, 0, 0);
  droneBody.torque.set(0, 0, 0);
  droneBody.wakeUp();

  const deckTop = START_Y + DY;
  cargoBodies.forEach((b, i) => {
    b.position.set(0, deckTop + CR + i * (CR * 2 + 0.025), 0);
    b.velocity.set(0, 0, 0);
    b.angularVelocity.set(0, 0, 0);
    b.quaternion.set(0, 0, 0, 1);
    b.force.set(0, 0, 0);
    b.torque.set(0, 0, 0);
    b.wakeUp();
  });

  // Snap camera
  camSmooth.set(0, 7, 14);
  camLookAt.set(0, START_Y, 0);
}

addEventListener('keydown', e => { if (e.code === 'KeyR') resetDrone(); });

// ─── FLIGHT CONTROLLER ────────────────────────────────────────────────────
// Pre-allocate Cannon vectors to avoid per-frame GC pressure
const _upLocal   = new CANNON.Vec3(0, 1, 0);
const _worldUp   = new CANNON.Vec3();
const _pidCorr   = new CANNON.Vec3();
const _thrustVec = new CANNON.Vec3();
const _localTorq = new CANNON.Vec3();

function applyFlightForces() {
  const thrusting = K['Space'];
  const pitchIn   = (+(K['KeyW'] || K['ArrowUp']))   - (+(K['KeyS'] || K['ArrowDown']));
  const rollIn    = (+(K['KeyD'] || K['ArrowRight'])) - (+(K['KeyA'] || K['ArrowLeft']));
  const yawIn     = (+K['KeyQ'])                      - (+K['KeyE']);

  // Thrust: push UP relative to drone's current orientation
  if (thrusting) {
    droneBody.quaternion.vmult(_upLocal, _thrustVec);
    _thrustVec.scale(THRUST_POWER, _thrustVec);
    droneBody.applyForce(_thrustVec, droneBody.position);
  }

  // Pitch / Roll / Yaw as LOCAL torques
  // +X rotation  → nose pitches forward (−Z)
  // +Z rotation  → drone rolls right (+X side up)
  // +Y rotation  → yaw left (CCW from above)
  _localTorq.set(
    pitchIn * TORQUE_POWER,
    yawIn   * YAW_POWER,
    rollIn  * TORQUE_POWER
  );
  if (pitchIn !== 0 || rollIn !== 0 || yawIn !== 0) {
    droneBody.applyLocalTorque(_localTorq);
  }

  // ── PID Auto-Stabiliser ─────────────────────────────────────────────
  // Compute drone's world-up vector, cross with target (0,1,0) to get
  // the corrective torque axis + magnitude.
  droneBody.quaternion.vmult(_upLocal, _worldUp);
  _worldUp.cross(_upLocal, _pidCorr);  // worldUp × (0,1,0) = corrective axis

  const pidP = AUTO_STABILIZE * 22;
  const pidD = AUTO_STABILIZE * 7;

  if (pitchIn === 0) {
    droneBody.torque.x += _pidCorr.x * pidP - droneBody.angularVelocity.x * pidD;
  }
  if (rollIn === 0) {
    droneBody.torque.z += _pidCorr.z * pidP - droneBody.angularVelocity.z * pidD;
  }
}

// ─── SYNC THREE ↔ CANNON ──────────────────────────────────────────────────
function syncMeshes() {
  droneGroup.position.copy(droneBody.position);
  droneGroup.quaternion.copy(droneBody.quaternion);

  cargoMeshes.forEach((m, i) => {
    m.position.copy(cargoBodies[i].position);
    m.quaternion.copy(cargoBodies[i].quaternion);
  });

  // Spin rotors; speed = thrust state
  const spinSpeed = K['Space'] ? 0.38 : 0.07;
  rotorDiscs.forEach((r, i) => { r.rotation.y += (i % 2 ? 1 : -1) * spinSpeed; });

  // Move rotor glow lights to world positions
  ARM_DIRS.forEach((dir, i) => {
    const wp = dir.clone().setY(0.15)
      .applyQuaternion(droneGroup.quaternion)
      .add(droneGroup.position);
    rotorLights[i].position.copy(wp);
    rotorLights[i].intensity = K['Space'] ? 2.2 : 0.4;
  });
}

// ─── CAMERA ───────────────────────────────────────────────────────────────
const camSmooth = new THREE.Vector3(0, 7, 14);
const camLookAt = new THREE.Vector3(0, START_Y, 0);
let   camYaw    = 0;

function updateCamera() {
  // Extract drone's yaw (Y-axis rotation) from its quaternion
  const q = droneBody.quaternion;
  const sY = 2 * (q.w * q.y + q.z * q.x);
  const cY = 1 - 2 * (q.x * q.x + q.y * q.y);
  const droneYaw = Math.atan2(sY, cY);
  camYaw += (droneYaw - camYaw) * 0.04;

  const offset = new THREE.Vector3(0, 4.5, 9)
    .applyEuler(new THREE.Euler(0, camYaw, 0));
  const dPos = new THREE.Vector3(
    droneBody.position.x, droneBody.position.y, droneBody.position.z
  );

  camSmooth.lerp(dPos.clone().add(offset), 0.06);
  camLookAt.lerp(dPos.clone().setY(dPos.y + 0.3), 0.1);
  camera.position.copy(camSmooth);
  camera.lookAt(camLookAt);
}

// ─── HUD & TILT INDICATOR ─────────────────────────────────────────────────
const elAlt   = document.getElementById('v-alt');
const elTilt  = document.getElementById('v-tilt');
const elSpd   = document.getElementById('v-spd');
const elCargo = document.getElementById('v-cargo');
const tiltCanvas = document.getElementById('tilt-canvas');
const tiltCtx    = tiltCanvas.getContext('2d');

function updateHUD() {
  const pos  = droneBody.position;
  const vel  = droneBody.velocity;
  const alt  = Math.max(0, pos.y - DY).toFixed(2);
  const spd  = Math.sqrt(vel.x*vel.x + vel.y*vel.y + vel.z*vel.z).toFixed(2);

  droneBody.quaternion.vmult(_upLocal, _worldUp);
  const tiltRad = Math.acos(Math.max(-1, Math.min(1, _worldUp.y)));
  const tiltDeg = (tiltRad * 180 / Math.PI).toFixed(1);

  let onBoard = 0;
  cargoBodies.forEach(b => {
    const dy = b.position.y - pos.y;
    const dx = Math.abs(b.position.x - pos.x);
    const dz = Math.abs(b.position.z - pos.z);
    if (dy > -0.5 && dy < 2.5 && dx < DX + CR + 0.2 && dz < DZ + CR + 0.2) onBoard++;
  });

  elAlt.textContent   = alt;
  elTilt.textContent  = tiltDeg;
  elSpd.textContent   = spd;
  elCargo.textContent = `${onBoard} / 3`;

  // Artificial horizon display
  const roll  =  _worldUp.x;  // ≈ sin(roll angle)
  const pitch = -_worldUp.z;  // ≈ sin(pitch forward)
  drawHorizon(roll, pitch);
}

function drawHorizon(roll, pitch) {
  tiltCtx.clearRect(0, 0, 90, 90);

  tiltCtx.save();
  tiltCtx.beginPath();
  tiltCtx.arc(45, 45, 43, 0, Math.PI * 2);
  tiltCtx.clip();

  tiltCtx.save();
  tiltCtx.translate(45, 45);
  tiltCtx.rotate(-Math.asin(Math.max(-1, Math.min(1, roll))));
  const pOff = pitch * 48;

  // Sky
  tiltCtx.fillStyle = '#001844';
  tiltCtx.fillRect(-45, -45, 90, 45 + pOff);
  // Ground
  tiltCtx.fillStyle = '#0d2208';
  tiltCtx.fillRect(-45, pOff, 90, 45 - pOff);
  // Horizon line
  tiltCtx.strokeStyle = 'rgba(255,255,255,0.55)';
  tiltCtx.lineWidth = 1.5;
  tiltCtx.beginPath();
  tiltCtx.moveTo(-43, pOff); tiltCtx.lineTo(43, pOff);
  tiltCtx.stroke();
  tiltCtx.restore();
  tiltCtx.restore();

  // Border circle
  tiltCtx.strokeStyle = 'rgba(0,255,136,0.3)';
  tiltCtx.lineWidth = 1;
  tiltCtx.beginPath();
  tiltCtx.arc(45, 45, 43, 0, Math.PI * 2);
  tiltCtx.stroke();

  // Crosshair
  tiltCtx.strokeStyle = 'rgba(255,255,255,0.6)';
  tiltCtx.lineWidth = 1;
  tiltCtx.beginPath();
  tiltCtx.moveTo(34, 45); tiltCtx.lineTo(56, 45);
  tiltCtx.moveTo(45, 34); tiltCtx.lineTo(45, 56);
  tiltCtx.stroke();

  // Centre dot
  tiltCtx.fillStyle = '#fff';
  tiltCtx.beginPath();
  tiltCtx.arc(45, 45, 2, 0, Math.PI * 2);
  tiltCtx.fill();
}

// ─── FIXED-TIMESTEP PHYSICS LOOP ──────────────────────────────────────────
const FIXED_DT  = 1 / 60;
let   accumulator = 0;
let   lastTime    = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  let dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  accumulator += dt;

  while (accumulator >= FIXED_DT) {
    applyFlightForces();
    world.step(FIXED_DT);
    accumulator -= FIXED_DT;
  }

  syncMeshes();
  updateCamera();
  updateHUD();
  renderer.render(scene, camera);
}

// ─── BOOT ─────────────────────────────────────────────────────────────────
resetDrone();
requestAnimationFrame(loop);
</script>
</body>
</html>
